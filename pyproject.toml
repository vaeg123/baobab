[project]
name = "baobab"
version = "0.2.0"
description = "Plateforme internationale d'intelligence juridique"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "asyncpg>=0.29.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "neo4j>=5.0.0",
    "pgvector>=0.3.0",
    "python-dateutil>=2.9.0",
    "ulid-py>=1.1.0",
    "beautifulsoup4>=4.12.0",
    "pdfplumber>=0.11.0",
    "anthropic>=0.30.0",
    "stripe==15.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.vercel]
entrypoint = "baobab.api.main:app"

[tool.uv]
# Keep Vercel pyproject installs aligned with the audited hashed requirements.
constraint-dependencies = [
    "alembic==1.20.0",
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anthropic==1.7.0",
    "anyio==4.15.1",
    "asyncpg==0.31.0",
    "beautifulsoup4==4.15.0",
    "certifi==2026.7.22",
    "cffi==2.1.1 ; platform_python_implementation != 'PyPy'",
    "charset-normalizer==3.5.1",
    "click==8.5.0",
    "cryptography==50.0.1",
    "docstring-parser==0.18.0",
    "fastapi==0.141.1",
    "greenlet==3.5.6 ; platform_machine == 'AMD64' or platform_machine == 'WIN32' or platform_machine == 'aarch64' or platform_machine == 'amd64' or platform_machine == 'ppc64le' or platform_machine == 'win32' or platform_machine == 'x86_64'",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpcore2==2.13.0 ; sys_platform != 'emscripten'",
    "httptools==0.8.0",
    "httpx==0.28.1",
    "httpx2==2.13.0",
    "httpx2-jsfetch==1.0 ; sys_platform == 'emscripten'",
    "idna==3.20",
    "jiter==0.17.0",
    "mako==1.4.1",
    "markupsafe==3.0.3",
    "neo4j==6.3.1",
    "pdfminer-six==20260107",
    "pdfplumber==0.11.10",
    "pgvector==0.5.0",
    "pillow==12.3.0",
    "pycparser==3.0 ; implementation_name != 'PyPy' and platform_python_implementation != 'PyPy'",
    "pydantic==2.13.5",
    "pydantic-core==2.46.5",
    "pydantic-settings==2.15.0",
    "pypdfium2==5.13.0",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.2.3",
    "python-multipart==0.0.32",
    "pytz==2026.3.post1",
    "pyyaml==6.0.3",
    "requests==2.34.2",
    "six==1.17.0",
    "sniffio==1.3.1",
    "soupsieve==2.9.2",
    "sqlalchemy==2.0.54",
    "starlette==1.6.0",
    "stripe==15.4.0",
    "truststore==0.10.4 ; sys_platform != 'emscripten'",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.4",
    "ulid-py==1.1.0",
    "urllib3==2.8.0",
    "uvicorn==0.53.0",
    "uvloop==0.22.1 ; platform_python_implementation != 'PyPy' and sys_platform != 'cygwin' and sys_platform != 'win32'",
    "watchfiles==1.2.0",
    "websockets==17.1",
]
