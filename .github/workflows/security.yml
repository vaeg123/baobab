name: Security regression checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:1/test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --require-hashes -r requirements.txt -r requirements-ocr.txt
      - run: python -m pip install pytest==9.1.1 pytest-asyncio==1.4.0 pip-audit==2.10.1
      - run: python -m pytest -q
      - run: python -m pip_audit --no-deps --disable-pip -r requirements.txt
